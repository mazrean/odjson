name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      # The canonical linter for this repo: the tools/lint package (go vet's
      # analyzers + staticcheck + stylecheck), wired in via the go.mod `tool`
      # directive. Not golangci-lint.
      - name: go tool lint
        run: go tool lint ./...

  bench:
    name: Benchmarks module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: bench/go.mod
          cache-dependency-path: "**/go.sum"

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # Compiles every test/benchmark binary without executing anything.
      - name: compile benchmarks
        run: go test -run '^$' ./...
