name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      # The canonical linter for this repo: the tools/lint module (go vet's
      # analyzers + staticcheck + stylecheck). Not golangci-lint. It is a
      # module of its own so that staticcheck stays out of the root module's
      # dependency graph, which means it is built first and then run from the
      # repository root, where its `./...` resolves against the root module.
      - name: build lint
        run: go build -C tools/lint -o lint .

      - name: lint
        run: ./tools/lint/lint ./...

      # `./...` from the root skips nested modules, so the linter's own
      # sources are checked here, from inside its module.
      - name: lint tools/lint
        working-directory: tools/lint
        run: ./lint ./...

  bench:
    name: Benchmarks module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: bench/go.mod
          cache-dependency-path: "**/go.sum"

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # Compiles every test/benchmark binary without executing anything.
      - name: compile benchmarks
        run: go test -run '^$' ./...
