name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    # Holds APP_ID (variable) and APP_PRIVATE_KEY (secret) for the GitHub App
    # whose installation token replaces the release PATs.
    environment: Release
    steps:
      - uses: actions/checkout@v5
        with:
          # GoReleaser needs the full history (and tags) to build the changelog
          # and to let the Go toolchain stamp the version into buildinfo.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            odjson
            homebrew-tap

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Creates the GitHub release and uploads the archives / nfpm packages.
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          # Same App token: the installation covers
          # github.com/mazrean/homebrew-tap, so no separate PAT is needed.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
